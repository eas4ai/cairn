<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 845.625 1034" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" font-family="&#39;Inter&#39;, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" role="graphics-document document" aria-roledescription="flowchart-v2" data-nodes="7" data-edges="8" data-type="flowchart" data-detail-tier="rich"><title>flowchart diagram</title><desc>A flowchart diagram with 7 nodes and 8 edges. Flowing top to bottom. Key nodes: Agent presents a decision, Is the choice clear?, Agent explains. Key relationships: Agent presents a decision points to Is the choice clear?; Is the choice clear? points to Agent explains with label: No: ask; Agent explains points to Is the choice clear?. Layout spans 766 by 954 units with 7 rendered node boxes and 8 routed edge paths.</desc><style>svg{--fm-bg: #fafafa;--fm-text-color: #444444;--fm-node-fill: #f0f0f0;--fm-node-stroke: #888888;--fm-edge-color: #666666;--fm-cluster-fill: rgba(200,200,200,0.3);--fm-cluster-stroke: #aaaaaa;--fm-accent-1: #555555;--fm-accent-2: #777777;--fm-accent-4: #bbbbbb;--fm-accent-5: #444444;--fm-accent-6: #666666;--fm-accent-7: #888888;}@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');.fm-text{font-family: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size: 15px;font-weight: 500;}svg{--fm-edge-muted:var(--fm-cluster-stroke);--fm-edge-label-bg:var(--fm-bg);--fm-edge-label-border:var(--fm-cluster-stroke);--fm-edge-label-text:var(--fm-text-color);--fm-surface-shadow:rgba(15,23,42,.08)}svg{shape-rendering:geometricPrecision;background:var(--fm-bg);background-image:radial-gradient(ellipse at 20% 0%,color-mix(in srgb,var(--fm-accent-1) 3%,transparent) 0%,transparent 50%),linear-gradient(180deg,var(--fm-bg) 0%,color-mix(in srgb,var(--fm-bg) 97%,var(--fm-node-stroke) 3%) 100%)}.fm-node{isolation:isolate;--fm-node-accent:var(--fm-node-str